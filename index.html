<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Social Media</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="phone-frame">
        <div class="phone-screen">

            <!-- Cabeçalho do Post -->
            <div class="post-header">
                <div class="user-info">
                    <img class="avatar-small" alt="Avatar"
                        src="https://upload.wikimedia.org/wikipedia/pt/thumb/0/04/Chiquititas2013.jpeg/330px-Chiquititas2013.jpeg?utm_source=pt.wikipedia.org&utm_campaign=parser&utm_content=thumbnail">
                    <span class="username">chiquititas_</span>
                </div>
                <div class="more-options">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="5" cy="12" r="2" />
                        <circle cx="12" cy="12" r="2" />
                        <circle cx="19" cy="12" r="2" />
                    </svg>
                </div>
            </div>

            <!-- Mídia Principal -->
            <div class="post-media">
                <img class="main-img" alt="Post principal" src="https://contigo.com.br/wp-content/uploads/legacy/2018/04/29/chiquititas-2904-1097200.jpg">
                <div class="user-badge">
                    <img src="https://www.maisnovela.com.br/wp-content/uploads/2020/12/chiquititas-1130140.jpg" alt="User overlay">
                    <div class="plus-icon">+</div>
                </div>
            </div>

            <!-- Barra de Interações -->
            <div class="post-actions">
                <div class="left-actions">
                    <button class="action-btn" id="botao-curtir">
                        <svg id="icone-coracao" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span id="contador-curtidas">1200</span>
                    </button>

                    <button class="action-btn" id="botao-comentar">
                        <svg id="icone-comentar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                        <span id="contador-comentarios">57</span>
                    </button>

                    <button class="action-btn" id="botao-compartilhar">
                        <svg id="icone-compartilhar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                        <span id="contador-compartilhamentos">24</span>
                    </button>
                </div>

                <button class="action-btn" id="botao-salvar">
                    <svg id="icone-salvar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
            </div>

            <!-- Detalhes / Curtidas -->
            <div class="post-details">
                <p class="likes">Liked by <strong>liam_beanz99</strong> and <strong>235 others</strong></p>
            </div>

            <!-- Navegação Inferior -->
            <div class="nav-bar">
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
